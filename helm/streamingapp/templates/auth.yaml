apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth
  namespace: {{ .Values.namespace }}

spec:
  replicas: {{ .Values.replicaCount }}

  selector:
    matchLabels:
      app: auth

  template:
    metadata:
      labels:
        app: auth

    spec:
      containers:
      - name: auth

        image: {{ .Values.images.auth }}

        ports:
        - containerPort: 3001

        env:
        - name: PORT
          value: "3001"

        - name: MONGO_URI
          value: "{{ .Values.mongo.uri }}"

        - name: JWT_SECRET
          value: "{{ .Values.jwtSecret }}"
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: {{ .Values.namespace }}

spec:
  selector:
    app: auth

  ports:
  - port: 3001
    targetPort: 3001
