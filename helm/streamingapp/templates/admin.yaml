apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin
  namespace: {{ .Values.namespace }}

spec:
  replicas: {{ .Values.replicaCount }}

  selector:
    matchLabels:
      app: admin

  template:
    metadata:
      labels:
        app: admin

    spec:
      containers:
      - name: admin

        image: {{ .Values.images.admin }}

        ports:
        - containerPort: 3003

        env:
        - name: PORT
          value: "3003"

        - name: MONGO_URI
          value: "{{ .Values.mongo.uri }}"

        - name: JWT_SECRET
          value: "{{ .Values.jwtSecret }}"
---
apiVersion: v1
kind: Service
metadata:
  name: admin-service
  namespace: {{ .Values.namespace }}

spec:
  selector:
    app: admin

  ports:
  - port: 3003
    targetPort: 3003
