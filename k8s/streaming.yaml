apiVersion: apps/v1
kind: Deployment
metadata:
  name: streaming
  namespace: streamingapp

spec:
  replicas: 2

  selector:
    matchLabels:
      app: streaming

  template:
    metadata:
      labels:
        app: streaming

    spec:
      containers:
      - name: streaming
        image: 429965676677.dkr.ecr.ap-south-1.amazonaws.com/streamingapp-streaming:latest
        imagePullPolicy: Always

        ports:
        - containerPort: 3002

        env:
        - name: PORT
          value: "3002"

        - name: MONGO_URI
          value: "mongodb://mongo:27017/streamingapp"

        - name: JWT_SECRET
          value: "changeme"

        - name: CLIENT_URLS
          value: "http://localhost:3000"

        - name: AWS_REGION
          value: "ap-south-1"

        - name: STREAMING_PUBLIC_URL
          value: "http://localhost:3002"

---
apiVersion: v1
kind: Service
metadata:
  name: streaming-service
  namespace: streamingapp

spec:
  selector:
    app: streaming

  ports:
  - port: 3002
    targetPort: 3002

  type: ClusterIP
